name: Windows Portable

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Assemble portable Windows package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'portable\StreamTool'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $nodeExe = (Get-Command node).Source
          Copy-Item $nodeExe (Join-Path $root 'node.exe')
          Copy-Item 'dist' (Join-Path $root 'dist') -Recurse
          Copy-Item 'node_modules' (Join-Path $root 'node_modules') -Recurse
          Copy-Item 'package.json' (Join-Path $root 'package.json')

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          title StreamTool
          echo StreamTool is starting...
          echo The browser should open automatically.
          echo Keep this window open while testing.
          echo Closing this window stops StreamTool.
          echo.
          node.exe dist\server\server\index.js
          if errorlevel 1 (
            echo.
            echo StreamTool stopped with an error.
            pause
          )
          '@ | Set-Content -Path (Join-Path $root 'START_STREAMTOOL.cmd') -Encoding ascii

          @'
          STREAMTOOL - PORTABLE TEST BUILD

          1. Double-click START_STREAMTOOL.cmd
          2. Keep the black window open while testing.
          3. Your default browser should open automatically.
          4. StreamTool chooses a free localhost port automatically.
          5. Closing the black window stops StreamTool.

          Nothing needs to be installed. Git and Node.js are already bundled in this test package.
          Application data is stored in %LOCALAPPDATA%\StreamTool.
          '@ | Set-Content -Path (Join-Path $root 'README_TEST.txt') -Encoding ascii

      - name: Smoke test packaged build
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'portable\StreamTool'
          $stdout = Join-Path $env:RUNNER_TEMP 'streamtool-portable.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'streamtool-portable.err.log'
          $env:STREAMTOOL_NO_OPEN = '1'
          $process = Start-Process -FilePath (Join-Path $root 'node.exe') `
            -ArgumentList 'dist\server\server\index.js' `
            -WorkingDirectory $root `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $url = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              $text = ''
              if (Test-Path $stdout) { $text += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $text += Get-Content $stderr -Raw }
              $match = [regex]::Match($text, 'http://127\.0\.0\.1:\d+')
              if ($match.Success) {
                $url = $match.Value
                break
              }
            }

            if (-not $url) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Portable StreamTool did not expose a localhost URL.'
            }

            Invoke-WebRequest "$url/api/health" -UseBasicParsing | Out-Null
            Invoke-WebRequest "$url/api/snapshot" -UseBasicParsing | Out-Null
            Invoke-WebRequest "$url/" -UseBasicParsing | Out-Null
            Invoke-WebRequest "$url/compact" -UseBasicParsing | Out-Null
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: StreamTool-Windows-x64
          path: portable/StreamTool
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
