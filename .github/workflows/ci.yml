name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Analytics tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          STREAMTOOL_NO_OPEN=1 npm start > streamtool-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          URL=""
          for _ in {1..30}; do
            URL=$(grep -oE 'http://127\.0\.0\.1:[0-9]+' streamtool-smoke.log | tail -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 0.5
          done

          if [ -z "$URL" ]; then
            cat streamtool-smoke.log
            echo "StreamTool did not expose a localhost URL"
            exit 1
          fi

          curl --fail --silent "$URL/api/health"
          curl --fail --silent "$URL/api/snapshot" | grep -q '"analytics"'
          curl --fail --silent "$URL/api/sessions" | grep -q '"sessions"'
          curl --fail --silent "$URL/" > /dev/null
          curl --fail --silent "$URL/compact" > /dev/null
